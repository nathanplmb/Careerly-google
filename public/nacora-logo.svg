<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="nacora-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Symbole Orbite (Gauche) -->
  <g transform="translate(5, 5)">
    <!-- Anneau principal -->
    <circle cx="40" cy="40" r="30" stroke="url(#nacora-logo-grad)" stroke-width="7" fill="none" />
    <!-- Noyau central -->
    <circle cx="40" cy="40" r="13" fill="url(#nacora-logo-grad)" />
    <!-- Satellite haut-droite -->
    <circle cx="62" cy="18" r="8" fill="url(#nacora-logo-grad)" />
  </g>

  <!-- Mot-clé NACORA (Droite) : contours blancs/adaptatifs et point violet dans le O -->
  <g transform="translate(95, 5)">
    <!-- N -->
    <path d="M 8 60 V 20 L 38 60 V 20" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- A -->
    <path d="M 50 60 L 68 20 L 86 60 M 56 47 H 80" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- C -->
    <path d="M 134 27 C 127 19 108 19 101 27 C 91 37 91 43 101 53 C 108 61 127 61 134 53" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- O (avec le point violet au centre) -->
    <circle cx="162" cy="40" r="20" stroke="currentColor" stroke-width="3" fill="none" />
    <circle cx="162" cy="40" r="6" fill="url(#nacora-logo-grad)" />
    <!-- R -->
    <path d="M 198 60 V 20 H 222 C 235 20 235 40 222 40 H 198 M 218 40 L 236 60" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- A -->
    <path d="M 248 60 L 266 20 L 284 60 M 254 47 H 278" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
